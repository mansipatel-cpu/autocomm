version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: autocomm-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: autocomm-postgres
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocomm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocomm_password}
      POSTGRES_DB: ${POSTGRES_DB:-autocomm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocomm} -d ${POSTGRES_DB:-autocomm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autocomm-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=autocomm
      - POSTGRES_PASSWORD=autocomm_password
      - POSTGRES_DB=autocomm
      - POSTGRES_URI=postgresql://autocomm:autocomm_password@postgres:5432/autocomm
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autocomm-worker
    command: npm run worker
    restart: always
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=autocomm
      - POSTGRES_PASSWORD=autocomm_password
      - POSTGRES_DB=autocomm
      - POSTGRES_URI=postgresql://autocomm:autocomm_password@postgres:5432/autocomm
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: autocomm-client-app
    restart: always
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    volumes:
      - ./client-app:/app
      - /app/node_modules

  superadmin-app:
    build:
      context: ./superadmin-app
      dockerfile: Dockerfile
    container_name: autocomm-superadmin-app
    restart: always
    ports:
      - '5174:5174'
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1/superadmin
    depends_on:
      - backend
    volumes:
      - ./superadmin-app:/app
      - /app/node_modules

volumes:
  redis-data:
  postgres-data:
